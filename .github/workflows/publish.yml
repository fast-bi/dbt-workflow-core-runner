name: Publish to PyPI

on:
  push:
    tags:
      - '2025.*.*.*'
      - '2026.*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-pypi-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: false
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install build twine
        pip install -r requirements.txt

    - name: Quick quality check (informational only)
      run: |
        echo "🔍 Running quick quality checks (informational only - won't block publishing)"
        pip install flake8 black mypy
        echo "📝 Checking code formatting..."
        black --check fast_bi_dbt_runner/ || (echo "⚠️  Formatting issues found (informational)" && true)
        echo "🔍 Checking code quality..."
        flake8 fast_bi_dbt_runner/ --count --exit-zero --max-line-length=127 || (echo "⚠️  Style issues found (informational)" && true)
        echo "✅ Quality checks completed (informational only)"
      continue-on-error: true

    - name: Stamp version from git tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${GITHUB_REF#refs/tags/}"
        sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
        grep '^version' pyproject.toml

    - name: Build package
      run: |
        pip install -r requirements.txt
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Verify version is not already on PyPI
      if: matrix.python-version == '3.11'
      env:
        PKG_NAME: fast-bi-dbt-runner
      run: |
        WHL_VERSION=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml)
        HTTP_CODE=$(curl -s -o /tmp/pypi.json -w "%{http_code}" \
          "https://pypi.org/pypi/${PKG_NAME}/${WHL_VERSION}/json")
        if [ "${HTTP_CODE}" = "200" ]; then
          echo "❌ Version ${WHL_VERSION} already on PyPI — aborting."
          python -c "import json;d=json.load(open('/tmp/pypi.json'));print('Published',d['info']['version'],'on',d['urls'][0]['upload_time'])"
          exit 1
        fi
        echo "✅ ${WHL_VERSION} not on PyPI yet."

    - name: Publish to PyPI
      if: matrix.python-version == '3.11'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        echo "📦 Publishing to PyPI..."
        set -euo pipefail
        twine upload --verbose dist/* 2>&1 | tee /tmp/twine-verbose.log
        echo "✅ Successfully published to PyPI!"
